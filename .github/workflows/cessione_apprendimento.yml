# Revisione R04 - 24/10/2026 - prima versione
# Cessione totale 20 kW - SOLO SIMULAZIONE: autoapprendimento (rigioco delle decisioni delle ultime 2 settimane e ricerca
# evolutiva dei parametri). Workflow separato, ogni 2 ore, per non bloccare il giro dei 30 minuti.
name: Cessione apprendimento

on:
  schedule:
    - cron: "23 1-23/2 * * *"     # ogni 2 ore (ore dispari, minuto 23: lontano dalle decisioni delle ore pari)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cessione-apprendimento
  cancel-in-progress: false

jobs:
  impara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Librerie Python
        run: pip install -q -r ml/requirements.txt

      - name: Apprendimento (al massimo 45 minuti di calcolo)
        continue-on-error: true
        timeout-minutes: 50
        env:
          EMS_REPO_DIR: ${{ github.workspace }}
          EMS_TEMPO_APPRENDIMENTO: "2700"
        run: python ml/cessione_apprendimento.py

      - name: Salvataggio nel repository
        run: |
          git config user.name "ems-simulazione"
          git config user.email "ems-simulazione@users.noreply.github.com"
          git add cessione/live/apprendimento.json || true
          git commit -q -m "Cessione: apprendimento $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')" || { echo "Niente da salvare"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash && git push -q && exit 0
            echo "Salvataggio non riuscito (il giro dei 30 minuti ha salvato nel frattempo): riprovo"; sleep 20
          done
          exit 1
